# Servicios de infraestructura.
# Desarrollo:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Solo MySQL para desarrollo. El sistema completo para el VPS está en docker-compose.prod.yml.
name: magui

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir en deploy/.env}
      MYSQL_DATABASE: ${DB_NAME:-magui}
      MYSQL_USER: ${DB_USER:?definir en deploy/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?definir en deploy/.env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 3307 en el host para no chocar con un MySQL local en 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
